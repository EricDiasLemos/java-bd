<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }

    .container {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 320px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus {
        border-color: #2a5298;
        box-shadow: 0 0 5px rgba(42,82,152,0.5);
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2a5298;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s;
    }

    button:hover {
        background: #1e3c72;
        transform: translateY(-2px);
    }
</style>
</head>

<body>

<div class="container">
    <h2>Cadastro</h2>

    <form id="formulario">
        <input type="text" id="nome" placeholder="Digite seu nome" />
        <input type="text" id="cidade" placeholder="Digite sua cidade" />
        <button type="submit">Enviar</button>
    </form>
</div>

</body>
</html>
